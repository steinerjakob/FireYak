name: Deploy Android

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (checks out tag v<version>); empty for a dev build'
        required: false
        type: string
      # --- main-branch dev builds (dev-builds.yml); nothing is committed ---
      ref:
        description: 'Commit to build when no version is given'
        required: false
        type: string
      build_number:
        description: 'versionCode for a dev build (marks the run as a dev build)'
        required: false
        type: string
      version_name:
        description: 'versionName for a dev build'
        required: false
        type: string
      build_label:
        description: 'Commit label shown on the About screen of a dev build'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty to bump from package.json)'
        required: false
        type: string

concurrency:
  # Dev builds only cancel older dev builds, never a release/hotfix run.
  group: android-${{ inputs.build_number && 'dev' || 'release' }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build job: holds NO signing/deploy secrets. Runs the dependency code
  # (npm ci, cap sync, gradle) and produces UNSIGNED artifacts.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_PROTOMAPS_API_KEY: ${{ secrets.PROTOMAPS_API_KEY_ANDROID }}
      APP_BUILD_LABEL: ${{ inputs.build_label }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
      INPUT_VERSION_NAME: ${{ inputs.version_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run buildAndSync

      - name: Resolve version
        id: version
        run: |
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            # Main-branch dev build: version/code come from dev-builds.yml and
            # are only applied to this checkout, never committed.
            VERSION="$INPUT_VERSION_NAME"
            CODE="$INPUT_BUILD_NUMBER"
            sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
            sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          elif [ -n "$INPUT_VERSION" ]; then
            # Called from release.yml (or dispatch with a version): the prepare
            # job already committed the version bump in tag v<version>.
            VERSION="$INPUT_VERSION"
            CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
          else
            # Standalone hotfix dispatch: bump the build number here.
            VERSION=$(node -p "require('./package.json').version")
            CUR=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
            # Same tick scheme as release.yml, so a hotfix outranks earlier dev builds.
            TICK=$(( $(date +%s) / 10 - 170000000 + 1 ))
            CODE=$(( CUR + 1 > TICK ? CUR + 1 : TICK ))
            sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
            sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VERSION versionCode=$CODE"

      - name: Set Up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Download Gradle (with retries)
        # services.gradle.org times out now and then; fetch the wrapper
        # distribution up front so the build steps find it cached.
        working-directory: ./android
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "::warning::Gradle download failed (attempt $attempt), retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "::error::Gradle download failed after 4 attempts"
          exit 1

      - name: Build Unsigned Release AAB
        working-directory: ./android
        run: ./gradlew bundleRelease

      - name: Build Unsigned Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Upload Unsigned AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aab
          path: ./android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: ./android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Deploy job: holds the signing keystore + Play credentials. Runs NO
  # dependency/build code; only signs the pre-built artifacts and uploads them.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download Unsigned AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-aab
          path: artifacts/aab

      - name: Download Unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apk
          path: artifacts/apk

      - name: Decode Keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: echo "$KEYSTORE_FILE" | tr -d '\n' | base64 --decode > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          jarsigner -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            artifacts/aab/app-release.aab "$KEY_ALIAS"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "Using build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -f -v 4 \
            artifacts/apk/app-release-unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "fireyak-v${VERSION}.apk" aligned.apk

      - name: Upload Signed APK to GitHub Release
        if: ${{ inputs.version != '' }}
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ env.VERSION }}
          files: fireyak-v${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Play Credentials
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: printf '%s' "$PLAY_STORE_JSON_KEY" > play-credentials.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3'

      - name: Deploy to Google Play
        run: |
          # supply auto-detects .apk files in the cwd and refuses apk+aab;
          # the signed apk is already on the GitHub release at this point
          rm -f aligned.apk fireyak-v*.apk
          bundle install
          # Tagged versions (release.yml, or a dispatch with a version) go straight
          # to production; everything else (main-branch dev builds, untagged
          # dispatch) goes to the internal testing track.
          if [ -n "$INPUT_VERSION" ]; then LANE=production; else LANE=internal; fi
          echo "Lane $LANE: $VERSION ($VERSION_CODE)"
          bundle exec fastlane android "$LANE" aab:"$(pwd)/artifacts/aab/app-release.aab"

      - name: Commit Version Bump
        if: ${{ inputs.version == '' && inputs.build_number == '' }}
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/build.gradle
          git commit -m "chore: bump android version to ${VERSION} (${VERSION_CODE}) [skip ci]" \
            || { echo "No changes to commit"; exit 0; }
          git push "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
