name: Deploy Ios

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (checks out tag v<version>); empty for a dev build'
        required: false
        type: string
      # --- main-branch dev builds (dev-builds.yml) ---
      ref:
        description: 'Commit to build when no version is given'
        required: false
        type: string
      build_number:
        description: 'CFBundleVersion for a dev build (marks the run as a dev build)'
        required: false
        type: string
      marketing_version:
        description: 'CFBundleShortVersionString for a dev build'
        required: false
        type: string
      build_label:
        description: 'Commit label shown on the About screen of a dev build'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty to use current ref)'
        required: false
        type: string

concurrency:
  # Dev builds only cancel older dev builds, never a release/hotfix run.
  group: ios-${{ inputs.build_number && 'dev' || 'release' }}
  cancel-in-progress: true

jobs:
  # xcodebuild needs match-provided signing during the archive step, so iOS
  # cannot use the build/sign split that Android does. It is hardened instead:
  # pinned actions, npm ci --ignore-scripts, no persisted credentials.
  deploy:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VITE_PROTOMAPS_API_KEY: ${{ secrets.PROTOMAPS_API_KEY_IOS }}
      APP_BUILD_LABEL: ${{ inputs.build_label }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run buildAndSync

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to TestFlight / App Store
        env:
          AUTHKEY_FILE: ${{ secrets.AUTHKEY_FILE }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          echo "$AUTHKEY_FILE" | base64 -d > authkey.json
          bundle install
          # Build numbers are 10-second ticks since 2023-11-14 (epoch 1700000000). Main-branch
          # dev builds (dev-builds.yml) use their commit time, releases use "now" + 1, so a
          # release always outranks the dev builds before it on Play and TestFlight.
          BUILD="${INPUT_BUILD_NUMBER:-$(( $(date +%s) / 10 - 170000000 + 1 ))}"
          ARGS=(build_number:"$BUILD")
          if [ -n "$INPUT_MARKETING_VERSION" ]; then
            ARGS+=(version:"$INPUT_MARKETING_VERSION")
          fi
          # Tagged versions (release.yml, or a dispatch with a version) are submitted
          # to App Store review and auto-released on approval; everything else
          # (main-branch dev builds, untagged dispatch) only goes to TestFlight.
          if [ -n "$INPUT_VERSION" ]; then LANE=release; else LANE=beta; fi
          echo "Lane $LANE: build $BUILD ${INPUT_MARKETING_VERSION:-(package.json version)}"
          bundle exec fastlane ios "$LANE" "${ARGS[@]}"
